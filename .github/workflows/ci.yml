# Pull request checks: lint, typecheck, test and build. Never deploys.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify export
        # basePath only changes URLs; next export still writes to out/ root.
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/gym/index.html
          test -f out/restaurant/index.html
          test -f out/clinic/index.html
          test -f out/sitemap.xml
          grep -q "/industry-demos/_next/static/" out/index.html
